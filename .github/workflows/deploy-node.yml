name: deploy-node

# Builds a Next.js standalone server (`output: 'standalone'`) and ships it to the server with rsync;
# the server's forced command (server/deploy in dm3yb/infra) makes it a release and reloads it in PM2.
# Called with `secrets: inherit`.
#
# Server contract (pinned host key):
#   rsync … <app>/      the release (standalone + .next/static + public + RELEASE) into /srv/incoming/<app>
#   node <app> <sha>    switch to that release and reload; for a rollback, a release already on disk
#
# Runtime secrets live only in /srv/env/<app>.env on the server; the build gets public values and
# placeholders through build-env. Caller job permissions: contents: read.

on:
  workflow_call:
    inputs:
      app:
        description: App name on the server (/srv/apps/<app>, the PM2 process)
        type: string
        required: true
      public-url:
        description: Public URL whose /api/health must report the new SHA
        type: string
        required: true
      sha:
        description: Rollback to this commit's release (still on the server); empty builds github.sha
        type: string
        default: ''
      package-manager:
        description: pnpm, bun or yarn (yarn 1)
        type: string
        default: pnpm
      node-version:
        description: Node version; the server runs Node 24
        type: string
        default: '24'
      app-dir:
        description: The Next.js app's directory from the repo root (in a monorepo, apps/<name>)
        type: string
        default: .
      build:
        description: Build command, run from the repo root
        type: string
        default: pnpm build
      build-env:
        description: JSON object of build-time values (NEXT_PUBLIC_*, placeholders the env check needs)
        type: string
        default: '{}'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Not cancelled midway: a newer run waits, and the freshness guard then skips the older commit.
    concurrency:
      group: deploy-${{ inputs.app }}
      cancel-in-progress: false
    steps:
      - name: Commit to deploy
        id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=${INPUT_SHA:-$GITHUB_SHA}
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a full git SHA: $sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Freshness guard: a deploy never moves backwards. Rollbacks (INPUT_SHA set) bypass it.
          skip=false
          if [[ -z "$INPUT_SHA" && "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$sha" ]]; then
            echo "::notice::main moved on; skipping the deploy of $sha"; skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "build=$([[ "$skip" == false && -z "$INPUT_SHA" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.sha.outputs.build == 'true'

      - name: Environment
        if: steps.sha.outputs.build == 'true'
        env:
          BUILD_ENV_JSON: ${{ inputs.build-env }}
        run: |
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$BUILD_ENV_JSON" >> "$GITHUB_ENV"
          # What the app reads at build time; PM2 sets the same at runtime (infra ecosystem.config.js).
          printf '%s\n' "GIT_SHA=$GITHUB_SHA" "SENTRY_RELEASE=$GITHUB_SHA" "VERCEL_DEPLOYMENT_ID=$GITHUB_SHA" \
            VERCEL_ENV=production NEXT_PUBLIC_VERCEL_ENV=production NEXT_TELEMETRY_DISABLED=1 >> "$GITHUB_ENV"

      - uses: dm3yb/workflows/.github/actions/setup@v2
        if: steps.sha.outputs.build == 'true'
        with:
          package-manager: ${{ inputs.package-manager }}
          node-version: ${{ inputs.node-version }}

      - uses: actions/cache@v6
        if: steps.sha.outputs.build == 'true'
        with:
          path: ${{ inputs.app-dir }}/.next/cache
          key: next-${{ inputs.app }}-${{ hashFiles('**/pnpm-lock.yaml', '**/bun.lock', '**/yarn.lock') }}-${{ github.sha }}
          restore-keys: next-${{ inputs.app }}-${{ hashFiles('**/pnpm-lock.yaml', '**/bun.lock', '**/yarn.lock') }}-

      # The Server Actions key is embedded in the build; one key keeps action IDs stable across releases.
      - name: Build
        if: steps.sha.outputs.build == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          ACTIONS_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          if [[ -n "$ACTIONS_KEY" ]]; then export NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="$ACTIONS_KEY"; fi
          unset ACTIONS_KEY
          ${{ inputs.build }}

      - name: Assemble the release
        if: steps.sha.outputs.build == 'true'
        env:
          APP_DIR: ${{ inputs.app-dir }}
        run: |
          rel="$RUNNER_TEMP/release"; rm -rf "$rel" && mkdir -p "$rel"
          cp -a "$APP_DIR/.next/standalone/." "$rel/"
          # In a monorepo the standalone tree mirrors the repo, so server.js sits under the app's path.
          dest="$rel"; [[ "$APP_DIR" == . ]] || dest="$rel/$APP_DIR"
          [[ -f "$dest/server.js" ]] || { echo "::error::no server.js in the standalone output (output: 'standalone'?)"; exit 1; }
          # Copy the contents: the standalone output may already hold a few traced files in these folders.
          mkdir -p "$dest/.next/static" && cp -a "$APP_DIR/.next/static/." "$dest/.next/static/"
          if [[ -d "$APP_DIR/public" ]]; then mkdir -p "$dest/public" && cp -a "$APP_DIR/public/." "$dest/public/"; fi
          [[ ! -e "$dest/public/public" && ! -e "$dest/.next/static/static" ]] || { echo "::error::public or static copied one level too deep"; exit 1; }
          # Runtime env comes from the server; never ship env files or the build cache.
          find "$rel" -name '.env*' -type f -delete; rm -rf "$dest/.next/cache"
          printf '%s\n' "$GITHUB_SHA" > "$rel/RELEASE"
          echo "release: $(du -sh "$rel" | cut -f1), $(find "$rel" -type f | wc -l) files"

      - name: Check the Sentry release
        if: steps.sha.outputs.build == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          [[ -n "$SENTRY_AUTH_TOKEN" ]] || { echo "::warning::SENTRY_AUTH_TOKEN is not set: no source maps"; exit 0; }
          curl -fsS -o /dev/null -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            "https://de.sentry.io/api/0/organizations/aerixity/releases/$GITHUB_SHA/" \
            || echo "::warning::Sentry release $GITHUB_SHA not found: source maps were not uploaded"

      - name: SSH key and pinned host key
        if: steps.sha.outputs.skip == 'false'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY_V2 }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          [[ -n "$DEPLOY_SSH_KEY" ]] || { echo "::error::DEPLOY_SSH_KEY_V2 is not set"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config

      # --checksum leaves unchanged files untouched, so releases share them as hard links on the server.
      - name: Upload
        if: steps.sha.outputs.build == 'true'
        env:
          APP: ${{ inputs.app }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]]; then
            echo "::notice::main moved on during the build; not uploading $GITHUB_SHA"; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0
          fi
          rsync -a --delete --checksum --stats "$RUNNER_TEMP/release/" "target:$APP/" | grep -E 'Total (transferred )?file size|Literal data'

      - name: Deploy ${{ steps.sha.outputs.sha }}
        if: steps.sha.outputs.skip == 'false' && env.SKIP != '1'
        env:
          APP: ${{ inputs.app }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          # shellcheck disable=SC2029  # the arguments go to the forced command on the server
          ssh target node "$APP" "$SHA" </dev/null

      - name: Smoke test
        if: steps.sha.outputs.skip == 'false' && env.SKIP != '1'
        env:
          URL: ${{ inputs.public-url }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          for _ in $(seq 1 10); do
            if body=$(curl -fsS --max-time 10 "$URL/api/health") && [[ "$body" == *"\"sha\":\"$SHA\""* ]]; then
              curl -fsS --max-time 10 -o /dev/null -w "GET / -> %{http_code}\n" "$URL/"
              echo "live: $body"; exit 0
            fi
            sleep 3
          done
          echo "::error::$URL/api/health does not report $SHA"; exit 1

      - name: Mark the Sentry release as deployed
        if: steps.sha.outputs.skip == 'false' && env.SKIP != '1'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          [[ -n "$SENTRY_AUTH_TOKEN" ]] || exit 0
          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" -H 'Content-Type: application/json' \
            -d '{"environment":"production"}' "https://de.sentry.io/api/0/organizations/aerixity/releases/$SHA/deploys/"
